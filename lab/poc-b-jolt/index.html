<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>堆积实验场 · POC B · Three.js + Jolt</title>
<style>
  html,body{margin:0;height:100%;background:#271b17;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #lab-bar{position:fixed;right:8px;top:8px;z-index:99;display:flex;gap:6px;
    font:12px/1.6 ui-monospace,Menlo,monospace}
  #lab-bar button{background:#3a2a22;color:#ffd88a;border:1px solid #6b4c3a;
    border-radius:5px;padding:5px 9px;cursor:pointer}
  #lab-bar button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="lab-bar"></div>
<script>
// rAF 回调里抛异常会静默停掉整个跑测（画面定格、HUD 不再更新），排查时很难看出来。
// 这里把未捕获异常留在 window.__errs 里，方便直接读。
window.__errs = [];
addEventListener('error', e => window.__errs.push(`${e.message} @ ${e.filename}:${e.lineno}`));
addEventListener('unhandledrejection', e => window.__errs.push(`REJ ${e.reason?.stack ?? e.reason}`));
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
